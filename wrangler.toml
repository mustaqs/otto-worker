name = "otto-worker"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Off deliberately: with preview URLs on, every deployed version gets its own
# public address. That is extra internet-facing surface on a Worker holding a
# production API key, for no benefit.
preview_urls = false

# NO SECRETS IN THIS FILE, ever. The Anthropic key is set out of band:
#   wrangler secret put ANTHROPIC_API_KEY
# It exists only in Cloudflare's environment and never in the repository —
# which is what makes publishing this source safe.

[[kv_namespaces]]
binding = "OTTO"
id = "a8141d2bc3cf455fa4a25d20014e2832"

[[d1_databases]]
binding = "DB"
database_name = "otto"
database_id = "0206e486-ed56-472d-ac58-d24c998f9cf2"

[observability]
enabled = false

[vars]
# Where sign-in's identity provider lives. NOT A SECRET — the key is. The key is
# SUPABASE_SECRET_KEY, set with `wrangler secret put`, a per-service secret key
# (sb_secret_…) sent as the `apikey` header and never as a bearer. It is read in
# exactly one function; Bench/check-question-path.sh asserts that.
SUPABASE_URL = "https://rfseqzmwzvzszdbzspjc.supabase.co"
# Bounds what a leaked token can do. See README: a token is not a general
# purpose Anthropic proxy.
MAX_BODY_BYTES = "6000000"
# Raised from 4096 for deep mode. Thinking counts against max_tokens on Opus,
# so an effort:high request on a dense screen truncates at 4096 — and a
# truncated deep answer reads as a worse answer rather than as a budget
# problem. This is a bound on the worst case, not a target: the system prompt
# still asks for a sentence or two, and the hourly request cap remains the
# real protection against a runaway bill.
MAX_OUTPUT_TOKENS = "16384"
MAX_IMAGES = "2"
